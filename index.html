<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal e-School Pintar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white; z-index: 999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading Animation -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Memuatkan Portal Sekolah...</p>
  </div>

  <!-- Google Apps Script Web App Frame -->
  <iframe id="portalFrame" src="" allow="camera; microphone; geolocation" onload="document.getElementById('loader').style.display='none';"></iframe>

  <script>
    // URL Google Apps Script Web App Anda:
    const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbz44JmQZ0TpSLj7YGRmybHhmFIYHtgFyRTcl5ox5Sp6afaSuTlOVwZ9kVDD0zmH5ARI/exec";
    
    // Teruskan sebarang parameter (seperti ?id=XBA1041) secara automatik
    const currentParams = window.location.search;
    document.getElementById("portalFrame").src = BASE_GAS_URL + currentParams;
  </script>
</body>
</html>
