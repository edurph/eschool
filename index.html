<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduRPH - Portal Digital Sekolah</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#312e81">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduRPH">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2602/2602414.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="portal" src="" allow="camera; microphone; geolocation"></iframe>

  <script>
    // URL Web App Deployment Baharu untuk Setiap Sekolah
    const URL_SK_SOOK = "https://script.google.com/macros/s/AKfycbzBeBpykfVe20xWA8FcBEobgUKrNnKr8BYfAoMzawE-2FoPs5NMe6FjF539b7Xm77DX4Q/exec";
    const URL_SK_LOTONG = "https://script.google.com/macros/s/AKfycbwuqk7gaXQQ1fktYxMUq8fFv9lCCMt5FupP8hBOCC6GfpP9jkQiWbql4rgqUX9Jobfw/exec";

    const host = window.location.hostname.toLowerCase();
    const urlParams = new URLSearchParams(window.location.search);
    let schoolId = (urlParams.get('id') || urlParams.get('sekolah') || '').toUpperCase();

    // 1. Pengecaman Subdomain & Penetapan Sasaran Iframe
    if (host.includes("sook") || schoolId === "XBA1041") {
      // 🏫 SK SOOK (XBA1041)
      document.getElementById("portal").src = URL_SK_SOOK + "?id=XBA1041";
    } 
    else if (host.includes("lotong") || schoolId === "XBA1111") {
      // 🏫 SK LOTONG (XBA1111)
      document.getElementById("portal").src = URL_SK_LOTONG + "?id=XBA1111";
    } 
    else {
      // 🌐 Domain Utama / Tanpa Subdomain -> Buka Landing Page
      window.location.replace("https://edurph.github.io/utama/");
    }

    // 2. Pendaftaran Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
